<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravastar - Gravity Across the Web</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        html, body {
            height: 100vh;
            width: 100vw;
        }

        /* Branding at the top left. */
        .branding {
            position: absolute;
            top: 10px;
            left: 10px;
        }

        /* Sync button at the top right. */
        #sync-button {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        /* Container for the canvas to center it on the screen. */
        .world-container {
            height: 100%;
            width: 100%;

            /* Centering. */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas sizing to take as much space as possible with constant aspect-ratio. */
        #world {
            background-color: black;
            width: min(calc(100vw - 1rem), calc(100vh - 1rem));
            height: min(calc(100vh - 1rem), calc(100vw - 1rem));
        }

        @media (min-width: 640px) {
            /* Different margins for smaller screens. */
            #world {
                width: min(calc(100vw - 2rem), calc(100vh - 2rem));
                height: min(calc(100vh - 2rem), calc(100vw - 2rem));
            }
        }
    </style>
</head>
<body>
    <h4 class="branding">Gravastar</h4>
    <button type="button" class="btn btn-light" id="sync-button">Sync</button>

    <div class="world-container">
        <canvas id="world"></canvas>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Local scripts -->
    <script src="src/vec3.js"></script>
    <script src="src/phyx.js"></script>
    <script src="src/back.js"></script>
    <script src="src/index.js"></script>
</body>
</html>
