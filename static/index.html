<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravastar - Gravity Across the Web</title>

    <link rel="icon" type="image/png" href="/favicon.png"/>

    <!--  Bulma CSS  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <!--  Custom fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Material icons   -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=volume_off,volume_up" />

    <style>
        html, body {
            height: 100vh;
            width: 100vw;
            /* TODO: Implement visible-on-contact wall. */
            /*background-color: rgb(48, 48, 48);*/
        }

        /* Sync button at the top right. */
        #sync-button {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }

        #mute-button {
            position: absolute;
            bottom: 10px;
            right: 90px;
        }

        /* Container for the canvas to center it on the screen. */
        .world-container {
            height: 100%;
            width: 100%;

            /* Centering. */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas sizing to take as much space as possible with constant aspect-ratio. */
        #world {
            background-color: rgb(48, 48, 48);
            width: min(calc(100vw - 1rem), calc(100vh - 1rem));
            height: min(calc(100vh - 1rem), calc(100vw - 1rem));
        }

        @media (min-width: 640px) {
            /* Different margins for smaller screens. */
            #world {
                width: min(calc(100vw - 2rem), calc(100vh - 2rem));
                height: min(calc(100vh - 2rem), calc(100vw - 2rem));
            }
        }

        #instruction {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            color: grey;
            pointer-events: none;
            animation: instructionFadeOut 3s ease-in-out forwards;
        }

        @keyframes instructionFadeOut {
            0% { opacity: 1; }
            65% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <button type="button" class="button is-primary is-dark" id="sync-button">Sync</button>

    <button class="button is-dark" id="mute-button">
        <span class="material-symbols-outlined" id="mute-button-icon">volume_off</span>
    </button>

    <div id="instruction">Tap on the screen to participate in the simulation.</div>

    <div class="world-container">
        <canvas id="world"></canvas>
    </div>

    <!-- Local scripts -->
    <script src="src/beep.js"></script>
    <script src="src/vec3.js"></script>
    <script src="src/phyx.js"></script>
    <script src="src/back.js"></script>
    <script src="src/index.js"></script>
</body>
</html>
